<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Marvel Pixel Battle</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070914;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

#app{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 15%,#202744 0,#0b0e1b 52%,#05060c 100%);
}

#game{
    position:relative;
    width:min(1200px,100vw);
    height:min(760px,100vh);
    overflow:hidden;
    background:#10162b;
    border:2px solid #30395b;
    box-shadow:0 22px 80px #000;
}

canvas{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

.ui{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:auto;
}

.hidden{
    display:none!important;
}

/* MENU */

.menu{
    width:min(1080px,94%);
    max-height:90%;
    overflow:auto;
    padding:26px;

    border:2px solid #3c476b;

    background:#0b0f20ee;

    box-shadow:0 16px 60px #000;
}

.title{
    font-size:32px;
    font-weight:1000;
    letter-spacing:2px;
    text-align:center;
    text-shadow:4px 4px #000;
    margin-bottom:6px;
}

.sub{
    text-align:center;
    color:#9eabd6;
    font-size:13px;
    margin-bottom:20px;
}

.roster{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
}

.hero{
    padding:12px;
    border:2px solid #323d63;
    background:#131a31;
    cursor:pointer;
    transition:.12s;
    min-height:108px;
}

.hero:hover{
    transform:translateY(-2px);
    border-color:#6a80e8;
}

.hero.active{
    border-color:#ffd34d;
    background:#231f28;
    box-shadow:0 0 0 2px #ffd34d55 inset;
}

.sprite{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    filter:drop-shadow(3px 3px #000);
}

.hero b{
    display:block;
    font-size:14px;
    margin-bottom:4px;
}

.hero small{
    display:block;
    color:#9aa9d7;
    line-height:1.35;
}

.start{
    display:block;
    margin:18px auto 0;
    padding:13px 24px;
    background:#f7ca3b;
    color:#16130a;
    border:0;
    font-weight:1000;
    cursor:pointer;
    font-size:16px;
    box-shadow:4px 4px #000;
}

.note{
    text-align:center;
    color:#6f7ba0;
    font-size:11px;
    margin-top:10px;
}

/* HUD */

#hud{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.bar{
    position:absolute;
    top:16px;
    width:35%;
    height:24px;
    border:2px solid #fff;
    background:#171b2d;
    box-shadow:4px 4px #0008;
}

.bar.left{
    left:18px;
}

.bar.right{
    right:18px;
}

.fill{
    height:100%;
    width:100%;
    transition:width .08s;
}

.hp{
    background:linear-gradient(#ff6673,#bd1f39);
}

.mana{
    background:linear-gradient(#75a4ff,#2e54c7);
}

.name{
    position:absolute;
    top:-23px;
    font-weight:900;
    font-size:13px;
    text-shadow:2px 2px #000;
}

.left .name{
    left:0;
}

.right .name{
    right:0;
}

.bar.right .fill{
    float:right;
}

.meterlabel{
    position:absolute;
    top:44px;
    font-size:11px;
    color:#9aa9d7;
}

.left .meterlabel{
    left:18px;
}

.right .meterlabel{
    right:18px;
    text-align:right;
}

.round{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:13px;
    font-weight:1000;
    background:#090c18d9;
    padding:5px 9px;
    border:2px solid #30395b;
}

.skills{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
    pointer-events:auto;
}

.skill{
    position:relative;
    width:62px;
    height:58px;
    border:2px solid #6977ad;
    background:#111831;
    color:#fff;
    font-weight:900;
    cursor:pointer;
}

.skill span{
    display:block;
    font-size:11px;
}

.skill b{
    font-size:18px;
}

.skill .cd{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000b;
    font-size:18px;
}

.skill.disabled{
    opacity:.45;
}

.combo{
    position:absolute;
    left:18px;
    top:95px;
    font-size:18px;
    font-weight:1000;
    text-shadow:3px 3px #000;
    opacity:0;
    transform:translateX(-12px);
    transition:.15s;
}

.combo.show{
    opacity:1;
    transform:none;
}

.controls{
    position:absolute;
    right:18px;
    top:90px;
    font-size:11px;
    color:#a8b1cf;
    background:#070b17aa;
    border:1px solid #2c3451;
    padding:7px;
}

/* RESULT */

.winner{
    font-size:28px;
    font-weight:1000;
    text-align:center;
    margin-bottom:8px;
}

.resultScore{
    text-align:center;
    color:#aeb9df;
    margin-bottom:16px;
}

.again{
    display:block;
    margin:auto;
    padding:11px 20px;
    border:0;
    background:#fff;
    color:#111;
    font-weight:1000;
    cursor:pointer;
}

/* MOBILE */

.pe{
    position:absolute;
    left:12px;
    bottom:12px;
    display:none;
    gap:10px;
    pointer-events:auto;
}

.pad{
    display:grid;
    grid-template-columns:48px 48px 48px;
    gap:5px;
}

.pad button,
.pe .act{
    width:48px;
    height:48px;
    background:#151d38cc;
    color:#fff;
    border:2px solid #6573a5;
    font-weight:1000;
}

.pad .blank{
    visibility:hidden;
}

.acts{
    display:grid;
    grid-template-columns:repeat(2,48px);
    gap:5px;
}

@media(max-width:820px){

    .roster{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .controls{
        display:none;
    }

    .bar{
        width:31%;
    }

    .skill{
        width:52px;
        height:52px;
    }

    .pe{
        display:flex;
    }

    .menu{
        padding:14px;
    }

    .title{
        font-size:24px;
    }

    .sub{
        margin-bottom:12px;
    }

    .hero{
        min-height:98px;
        padding:8px;
    }

    .hero small{
        font-size:10px;
    }
}

@media(max-width:560px){

    .roster{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .bar{
        width:38%;
    }

    .name{
        font-size:10px;
    }

    .meterlabel{
        font-size:9px;
    }

    .skills{
        bottom:5px;
        gap:3px;
    }

    .skill{
        width:43px;
        height:48px;
    }

    .skill span{
        font-size:8px;
    }

    .skill b{
        font-size:15px;
    }

    .pe{
        transform:scale(.9);
        transform-origin:bottom left;
    }
}
</style>
</head>

<script>
'use strict';

const C = document.getElementById('c');
const ctx = C.getContext('2d');

ctx.imageSmoothingEnabled = false;

const W = 1200;
const H = 760;
const G = 655;

const keys = {};

let selected = 'spiderman';

let running = false;

let pausedHud = false;

let roundTime = 0;

let last = performance.now();

let particles = [];

let texts = [];

let projectiles = [];

let effects = [];

let cpuThink = 0;

let shake = 0;

let hitStop = 0;

const clamp = (v,a,b) =>
    Math.max(a,Math.min(b,v));

const rnd = (a,b) =>
    Math.random()*(b-a)+a;

const pick = a =>
    a[(Math.random()*a.length)|0];


/*
==========================================

==========================================
*/

const heroes = {

},

},

thanos:{

    skills:[
        ['Q','Titan Punch',18,.8,'smash'],

    ]
}

};

const heroKeys = Object.keys(heroes);


/*
==========================================
FIGHTER
==========================================
*/

function resetState(hero,side){

    return {

        x: side === 'p' ? 250 : 930,

        y:G-90,

        w:58,

        h:84,

        vx:0,

        vy:0,

        dir: side === 'p' ? 1 : -1,

        ground:true,

        hp:hero.hp,

        mana:hero.mana,

        hero,

        side,

        stun:0,

        inv:0,

        attackCd:0,

        skillCd:[0,0,0,0],

        shield:0,

        combo:0,

        comboTimer:0,

        dead:false,

        flash:0,

        state:'idle'
    };
}

let P = null;
let E = null;


/*
==========================================
START GAME
==========================================
*/

function spawnGame(){

    P = resetState(
        heroes[selected],
        'p'
    );

    const available =
        heroKeys.filter(
            k => k !== selected
        );

    const enemy =
        pick(available);

    E = resetState(
        heroes[enemy],
        'e'
    );

    roundTime = 0;

    particles = [];
    texts = [];
    projectiles = [];
    effects = [];

    cpuThink = 0;

    running = true;

    document
        .getElementById('select')
        .classList
        .add('hidden');

    document
        .getElementById('result')
        .classList
        .add('hidden');

    document
        .getElementById('hud')
        .classList
        .remove('hidden');

    updateHUD();
}


/*
==========================================
COLLISION
==========================================
*/

function rect(a){

    return {

        x:a.x-a.w/2,

        y:a.y-a.h,

        w:a.w,

        h:a.h
    };
}

function overlap(a,b){

    return (

        a.x < b.x+b.w &&

        a.x+a.w > b.x &&

        a.y < b.y+b.h &&

        a.y+a.h > b.y
    );
}


/*
==========================================
DAMAGE
==========================================
*/

function hurt(
    target,
    damage,
    stun=0,
    knock=0,
    source=null
){

    if(target.dead) return;

    if(target.inv>0) return;

    if(target.shield>0){

        damage *= .25;

        target.shield = 0;

        burst(
            target.x,
            target.y-target.h*.6,
            10,
            '#ffe36e'
        );
    }

    target.hp -= damage;

    target.stun =
        Math.max(
            target.stun,
            stun
        );

    target.vx += knock;

    target.flash = .13;

    hitStop = .035;

    addText(
        target.x,
        target.y-target.h-16,
        '-'+Math.round(damage),
        '#fff'
    );

    burst(
        target.x,
        target.y-target.h*.5,
        7,
        target.hero.color
    );

    if(target.hp<=0){

        target.hp=0;

        target.dead=true;

        target.vx=0;

        target.vy=0;

        effects.push({
            type:'ko',
            x:target.x,
            y:target.y,
            life:1
        });
    }
}


/*
==========================================
TEXT / PARTICLES
==========================================
*/

function addText(x,y,text,color){

    texts.push({
        x,
        y,
        text,
        color,
        life:.8
    });
}

function burst(x,y,count,color){

    for(let i=0;i<count;i++){

        const angle =
            rnd(0,Math.PI*2);

        const speed =
            rnd(40,320);

        particles.push({

            x,

            y,

            vx:
                Math.cos(angle)*speed,

            vy:
                Math.sin(angle)*speed,

            life:
                rnd(.18,.6),

            s:
                pick([2,3,4]),

            color
        });
    }
}

function spawnProj(
    x,
    y,
    vx,
    vy,
    r,
    damage,
    color,
    type,
    life=1.8,
    owner=P
){

    projectiles.push({

        x,
        y,

        vx,
        vy,

        r,

        dmg:damage,

        color,

        type,

        life,

        owner
    });
}


/*
==========================================
FACE
==========================================
*/

function face(a,b){

    a.dir =
        b.x>a.x
        ? 1
        : -1;
}


/*
==========================================
NORMAL ATTACK
==========================================
*/

function basicAttack(a,b){

    if(a.attackCd>0) return;

    if(a.stun>0) return;

    if(a.dead) return;

    a.attackCd=.33;

    a.state='attack';

    const reach=76;

    const attackRect={

        x:
            a.dir>0
            ? a.x-6
            : a.x-reach+6,

        y:
            a.y-a.h+24,

        w:reach,

        h:46
    };

    if(
        overlap(
            attackRect,
            rect(b)
        )
    ){

        hurt(
            b,
            6,
            .08,
            a.dir*100,
            a
        );

        a.combo++;

        a.comboTimer=.9;

        addText(
            a.x,
            a.y-a.h-28,
            a.combo+' HIT',
            '#ffe36e'
        );

        burst(
            b.x,
            b.y-b.h*.6,
            5,
            a.hero.color
        );
    }
}


/*
==========================================
SKILLS
==========================================
*/

function skill(a,b,index){

    if(a.dead) return;

    if(a.stun>0) return;

    if(a.skillCd[index]>0) return;

    const s =
        a.hero.skills[index];

    if(a.mana<s[2]){

        addText(
            a.x,
            a.y-a.h-24,
            'NO MANA',
            '#7ea5ff'
        );

        return;
    }

    a.mana -= s[2];

    a.skillCd[index] = s[3];

    const type=s[4];

    const dir=a.dir;

    a.state='skill';


    /* PROJECTILES */

    if(
        type==='web' ||
        type==='bolt' ||
        type==='chaos'
    ){

        spawnProj(

            a.x+dir*34,

            a.y-a.h*.55,

            dir*650,

            0,

            9,

            s[2]*.65,

            a.hero.color,

            type,

            1.4,

            a
        );
    }


    /* DASH */

    else if(
        type==='dash' ||
        type==='portal'
    ){

        a.vx=dir*700;

        a.inv=.25;

        effects.push({

            type:'trail',

            x:a.x,

            y:a.y-35,

            life:.35,

            color:a.hero.color
        });
    }


    /* SHIELD */

    else if(type==='shield'){

        a.shield=.8;

        burst(
            a.x,
            a.y-a.h*.5,
            20,
            '#74c0ff'
        );
    }


    /* HAMMER */

    else if(type==='hammer'){

        spawnProj(

            a.x+dir*36,

            a.y-a.h*.55,

            dir*520,

            -50,

            11,

            s[2]*.75,

            a.hero.color,

            type,

            1.7,

            a
        );
    }


    /* CLOSE SLASH */

    else if(
        type==='slash' ||
        type==='slash2'
    ){

        areaHit(
            a,
            b,
            18,
            100,
            .15,
            a.hero.color
        );
    }


    /* HULK SMASH */

    else if(type==='smash'){

        areaHit(
            a,
            b,
            18,
            110,
            .2,
            a.hero.color
        );

        a.vy=-250;

        burst(
            a.x,
            G-90,
            20,
            a.hero.color
        );
    }


    /* DASH ATTACK */

    else if(
        type==='dashhit' ||
        type==='rush'
    ){

        a.vx=dir*820;

        a.inv=.28;

        effects.push({

            type:'rush',

            x:a.x,

            y:a.y-40,

            life:.35,

            color:a.hero.color,

            side:dir
        });
    }


    /* BEAM */

    else if(type==='beam'){

        effects.push({

            type:'beam',

            owner:a,

            life:.38,

            delay:.06,

            done:false
        });
    }


    /* LIGHTNING */

    else if(
        type==='lightning' ||
        type==='storm' ||
        type==='ragnarok'
    ){

        effects.push({

            type,

            owner:a,

            life:.75,

            t:.75,

            done:false
        });
    }


    /* BARRAGE */

    else if(
        type==='barrage' ||
        type==='missiles' ||
        type==='guns'
    ){

        for(
            let n=0;
            n<5;
            n++
        ){

            setTimeout(()=>{

                if(!a.dead){

                    spawnProj(

                        a.x+dir*34,

                        a.y-a.h*.55,

                        dir*rnd(500,680),

                        rnd(-180,160),

                        7,

                        s[2]*.32,

                        a.hero.color,

                        type,

                        .9,

                        a
                    );
                }

            },n*65);
        }
    }


    /* BIG ULTIMATE */

    else if(
        type==='strike' ||
        type==='overload' ||
        type==='fury' ||
        type==='kinetic' ||
        type==='max' ||
        type==='crush' ||
        type==='eye' ||
        type==='illusions' ||
        type==='snap' ||
        type==='hulkout' ||
        type==='leap' ||
        type==='bind' ||
        type==='hex' ||
        type==='quake'
    ){

        effects.push({

            type,

            owner:a,

            life:.7,

            t:.7,

            done:false
        });
    }


    /* HEAL */

    else if(type==='heal'){

        a.hp =
            clamp(
                a.hp+a.hero.hp*.24,
                0,
                a.hero.hp
            );

        burst(
            a.x,
            a.y-a.h*.5,
            16,
            '#75ff95'
        );

        addText(
            a.x,
            a.y-a.h-18,
            'HEAL',
            '#75ff95'
        );
    }
}


/*
==========================================
AREA HIT
==========================================
*/

function areaHit(
    a,
    b,
    damage,
    reach,
    stun,
    color
){

    const area={

        x:
            a.x+
            (
                a.dir>0
                ? 0
                : -reach
            ),

        y:
            a.y-a.h+8,

        w:
            reach*1.5,

        h:
            a.h*.8
    };

    if(
        overlap(
            area,
            rect(b)
        )
    ){

        hurt(
            b,
            damage,
            stun,
            a.dir*180,
            a
        );

        burst(
            b.x,
            b.y-b.h*.55,
            13,
            color
        );
    }
}


/*
==========================================
FIGHTER UPDATE
==========================================
*/

function updateFighter(a,o,dt){

    if(a.dead) return;

    a.inv =
        Math.max(
            0,
            a.inv-dt
        );

    a.stun =
        Math.max(
            0,
            a.stun-dt
        );

    a.attackCd =
        Math.max(
            0,
            a.attackCd-dt
        );

    a.flash =
        Math.max(
            0,
            a.flash-dt
        );

    a.comboTimer =
        Math.max(
            0,
            a.comboTimer-dt
        );

    if(a.comboTimer<=0)
        a.combo=0;

    for(let i=0;i<4;i++){

        a.skillCd[i] =
            Math.max(
                0,
                a.skillCd[i]-dt
            );
    }

    a.mana =
        clamp(
            a.mana+7*dt,
            0,
            a.hero.mana
        );

    a.vy += 1450*dt;

    a.y += a.vy*dt;

    if(a.y>=G-90){

        a.y=G-90;

        a.vy=0;

        a.ground=true;

    }else{

        a.ground=false;
    }

    if(a.stun<=0){

        a.x += a.vx*dt;

        a.vx *=
            Math.pow(
                .0008,
                dt
            );
    }

    a.x =
        clamp(
            a.x,
            60,
            W-60
        );

    face(a,o);
}


/*
==========================================
PLAYER INPUT
==========================================
*/

let spaceLock=false;

function playerInput(){

    if(!P) return;

    if(P.dead) return;

    if(P.stun>0) return;

    const move =
        (keys['d'] ||
         keys['arrowright']
        ? 1:0)
        -
        (keys['a'] ||
         keys['arrowleft']
        ? 1:0);

    P.vx =
        move *
        P.hero.speed;

    if(
        (keys['space'] ||
         keys['wup'])
        &&
        P.ground
        &&
        !spaceLock
    ){

        P.vy =
            -P.hero.jump;

        spaceLock=true;
    }

    if(
        !(keys['space'] ||
          keys['wup'])
    ){

        spaceLock=false;
    }

    if(keys['j']){

        basicAttack(P,E);

        keys['j']=false;
    }

    for(
        let i=0;
        i<4;
        i++
    ){

        const k =
            ['q','w','e','r'][i];

        if(keys[k]){

            skill(
                P,
                E,
                i
            );

            keys[k]=false;
        }
    }
}


/*
==========================================
CPU
==========================================
*/

function cpuAI(dt){

    if(!E || E.dead)
        return;

    cpuThink-=dt;

    const dx =
        P.x-E.x;

    const dist =
        Math.abs(dx);

    if(E.stun>0)
        return;

    if(dist>120){

        E.vx =
            Math.sign(dx) *
            E.hero.speed *
            .72;

    }else{

        E.vx=0;
    }

    if(
        E.ground &&
        Math.random()<.004
    ){

        E.vy =
            -E.hero.jump*.9;
    }

    if(cpuThink<=0){

        cpuThink =
            rnd(.18,.5);

        if(
            dist<100 &&
            E.attackCd<=0 &&
            Math.random()<.7
        ){

            basicAttack(
                E,
                P
            );

        }else{

            const available =
                E.hero.skills
                .map((s,i)=>[i,s])
                .filter(
                    ([i,s]) =>
                        E.mana>=s[2] &&
                        E.skillCd[i]<=0
                );

            if(
                available.length &&
                Math.random()<.72
            ){

                const [i] =
                    pick(available);

                skill(
                    E,
                    P,
                    i
                );
            }
        }
    }
}


/*
==========================================
PROJECTILES
==========================================
*/

function updateProjectiles(dt){

    for(
        let i=projectiles.length-1;
        i>=0;
        i--
    ){

        const p =
            projectiles[i];

        p.life-=dt;

        p.x += p.vx*dt;

        p.y += p.vy*dt;

        p.vy += 250*dt;

        const target =
            p.owner===P
            ? E
            : P;

        if(
            !target.dead &&
            overlap(
                {
                    x:p.x-p.r,
                    y:p.y-p.r,
                    w:p.r*2,
                    h:p.r*2
                },
                rect(target)
            )
        ){

            hurt(
                target,
                p.dmg,
                .08,
                p.vx>0?90:-90,
                p.owner
            );

            p.life=0;

            effects.push({

                type:'hit',

                x:p.x,

                y:p.y,

                life:.25,

                color:p.color
            });
        }

        if(
            p.life<=0 ||
            p.x<-100 ||
            p.x>W+100 ||
            p.y>G+40
        ){

            projectiles.splice(
                i,
                1
            );
        }
    }
}


/*
==========================================
EFFECTS
==========================================
*/

function updateEffects(dt){

    for(
        let i=effects.length-1;
        i>=0;
        i--
    ){

        const e =
            effects[i];

        e.life-=dt;

        if(
            e.owner &&
            !e.done
        ){

            const a=e.owner;

            const b =
                a===P
                ? E
                : P;

            const dist =
                Math.abs(
                    a.x-b.x
                );

            const types = [

                'beam',
                'lightning',
                'storm',
                'ragnarok',
                'strike',
                'overload',
                'fury',
                'kinetic',
                'max',
                'crush',
                'eye',
                'illusions',
                'snap',
                'hulkout',
                'leap',
                'bind',
                'hex',
                'quake'
            ];

            if(
                types.includes(e.type) &&
                e.life<.52
            ){

                const damageMap={

                    beam:20,

                    lightning:24,

                    storm:28,

                    ragnarok:34,

                    strike:30,

                    overload:30,

                    fury:28,

                    kinetic:25,

                    max:34,

                    crush:36,

                    eye:34,

                    illusions:25,

                    snap:42,

                    hulkout:34,

                    leap:24,

                    bind:16,

                    hex:22,

                    quake:23
                };

                const reachMap={

                    beam:380,

                    lightning:160,

                    storm:260,

                    ragnarok:270,

                    strike:250,

                    overload:260,

                    fury:230,

                    kinetic:180,

                    max:250,

                    crush:240,

                    eye:260,

                    illusions:280,

                    snap:400,

                    hulkout:240,

                    leap:220,

                    bind:300,

                    hex:300,

                    quake:180
                };

                const dmg =
                    damageMap[e.type] ||
                    20;

                const reach =
                    reachMap[e.type] ||
                    200;

                if(dist<reach){

                    hurt(
                        b,
                        dmg,
                        .25,
                        a.dir*260,
                        a
                    );

                    burst(
                        b.x,
                        b.y-b.h*.55,
                        18,
                        a.hero.color
                    );

                    e.done=true;

                    shake=.16;
                }
            }
        }

        if(e.life<=0){

            effects.splice(
                i,
                1
            );
        }
    }
}


/*
==========================================
GAME UPDATE
==========================================
*/

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];

        p.life-=dt;

        p.x += p.vx*dt;

        p.y += p.vy*dt;

        p.vy += 560*dt;

        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );
        }
    }
}

function updateTexts(dt){

    for(
        let i=texts.length-1;
        i>=0;
        i--
    ){

        const t =
            texts[i];

        t.life-=dt;

        t.y -= 30*dt;

        if(t.life<=0){

            texts.splice(
                i,
                1
            );
        }
    }
}

function tick(dt){

    if(!running)
        return;

    if(hitStop>0){

        hitStop-=dt;

        return;
    }

    roundTime+=dt;

    playerInput();

    cpuAI(dt);

    updateFighter(
        P,
        E,
        dt
    );

    updateFighter(
        E,
        P,
        dt
    );

    updateProjectiles(dt);

    updateEffects(dt);

    updateParticles(dt);

    updateTexts(dt);

    if(
        P.dead ||
        E.dead
    ){

        running=false;

        setTimeout(
            showResult,
            450
        );
    }

    updateHUD();
}


/*
==========================================
RESULT
==========================================
*/

function showResult(){

    document
        .getElementById('winner')
        .textContent =
        P.dead
        ? 'DEFEAT'
        : 'VICTORY';

    document
        .getElementById('winner')
        .style.color =
        P.dead
        ? '#ff6673'
        : '#ffe36e';

    document
        .getElementById('resultScore')
        .textContent =
        P.dead
        ? E.hero.name+' thắng'
        : 'Bạn đã hạ '+E.hero.name;

    document
        .getElementById('result')
        .classList
        .remove('hidden');

    document
        .getElementById('hud')
        .classList
        .add('hidden');
}


/*
==========================================
HUD
==========================================
*/

function updateHUD(){

    if(!P || !E)
        return;

    document
        .getElementById('pname')
        .textContent =
        P.hero.name;

    document
        .getElementById('ename')
        .textContent =
        E.hero.name;

    document
        .getElementById('php')
        .style.width =
        (
            P.hp /
            P.hero.hp *
            100
        )+'%';

    document
        .getElementById('ehp')
        .style.width =
        (
            E.hp /
            E.hero.hp *
            100
        )+'%';

    document
        .getElementById('pm')
        .style.width =
        (
            P.mana /
            P.hero.mana *
            100
        )+'%';

    document
        .getElementById('em')
        .style.width =
        (
            E.mana /
            E.hero.mana *
            100
        )+'%';

    document
        .getElementById('pmana')
        .textContent =
        Math.round(P.mana);

    document
        .getElementById('emana')
        .textContent =
        Math.round(E.mana);

    const combo =
        document.getElementById(
            'combo'
        );

    combo.textContent =
        P.combo+' HIT COMBO';

    combo.classList.toggle(
        'show',
        P.combo>1
    );

    const skillBox =
        document.getElementById(
            'skills'
        );

    if(
        skillBox.childElementCount!==4
    ){

        skillBox.innerHTML =
            P.hero.skills
            .map(
                (s,i)=>
                `
                <button
                    class="skill"
                    data-i="${i}"
                >
                    <b>${s[0]}</b>
                    <span>${s[1]}</span>
                    <div class="cd"></div>
                </button>
                `
            )
            .join('');

        skillBox
            .querySelectorAll('.skill')
            .forEach(
                btn=>{
                    btn.onclick=()=>
                        skill(
                            P,
                            E,
                            +btn.dataset.i
                        );
                }
            );
    }

    skillBox
        .querySelectorAll('.skill')
        .forEach(
            (btn,i)=>{

                const cooldown =
                    P.skillCd[i];

                btn.classList.toggle(
                    'disabled',
                    cooldown>0 ||
                    P.mana<
                    P.hero.skills[i][2]
                );

                btn.querySelector(
                    '.cd'
                ).textContent =
                    cooldown>0
                    ? cooldown.toFixed(1)
                    : '';
            }
        );
}


/*
==========================================
PIXEL BACKGROUND
==========================================
*/

function bg(){

    ctx.fillStyle='#10172d';

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /* SKY PIXEL GRID */

    for(
        let y=70;
        y<520;
        y+=55
    ){

        ctx.fillStyle =
            'rgba(88,111,170,.08)';

        ctx.fillRect(
            0,
            y,
            W,
            1
        );
    }

    /* CITY */

    ctx.fillStyle='#151c33';

    for(
        let x=0;
        x<W;
        x+=90
    ){

        const height =
            130+
            ((x*13)%150);

        ctx.fillRect(
            x,
            G-90-height,
            70,
            height
        );

        ctx.fillStyle =
            'rgba(255,215,106,.28)';

        for(
            let yy=
                G-105-height;
            yy<G-105;
            yy+=24
        ){

            ctx.fillRect(
                x+12,
                yy,
                7,
                6
            );
        }

        ctx.fillStyle='#151c33';
    }

    /* GROUND */

    ctx.fillStyle='#080b14';

    ctx.fillRect(
        0,
        G-90,
        W,
        90
    );

    /* ROAD PIXELS */

    for(
        let x=-(roundTime*160%120);
        x<W;
        x+=120
    ){

        ctx.fillStyle='#333b56';

        ctx.fillRect(
            x,
            G-46,
            64,
            4
        );
    }

    /* NEON */

    ctx.fillStyle='#cb2b5c';

    ctx.fillRect(
        0,
        G-90,
        W,
        3
    );
}


/*
==========================================
PIXEL CHARACTER DRAW
==========================================
*/

function drawPixelHero(a){

    const x =
        Math.round(a.x);

    const y =
        Math.round(a.y);

    const color =
        a.hero.color;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    if(a.inv>0){

        ctx.globalAlpha =
            .55+
            Math.sin(
                performance.now()/40
            )*.2;
    }

    const run =
        Math.sin(
            performance.now()*.018+
            (a===E?1:0)
        )*4;

    /* SHADOW */

    ctx.fillStyle='#0008';

    ctx.fillRect(
        -24,
        2,
        48,
        8
    );

    /* BODY */

    ctx.fillStyle=color;

    ctx.fillRect(
        -20,
        -65,
        40,
        54
    );

    /* SHOULDER */

    ctx.fillRect(
        -24,
        -46,
        48,
        14
    );

    /* FACE */

    ctx.fillStyle='#f2c7a5';

    ctx.fillRect(
        -15,
        -87,
        30,
        22
    );

    /* HAIR / MASK */

    ctx.fillStyle='#1a2040';

    ctx.fillRect(
        -12,
        -81,
        24,
        7
    );

    /* ARMS */

    ctx.fillStyle=color;

    ctx.fillRect(
        -25,
        -58,
        9,
        28
    );

    ctx.fillRect(
        16,
        -58,
        9,
        28
    );

    /* LEGS */

    ctx.fillStyle='#10121d';

    ctx.fillRect(
        -16,
        -12,
        13,
        24+run
    );

    ctx.fillRect(
        3,
        -12,
        13,
        24-run
    );

    /* VISOR */

    ctx.fillStyle='#fff';

    ctx.fillRect(
        -6,
        -67,
        12,
        3
    );


    /* IRON MAN */

    if(
        a.hero.name==='Iron Man'
    ){

        ctx.fillStyle='#ffd64a';

        ctx.fillRect(
            -6,
            -48,
            12,
            10
        );
    }


    /* CAP */

    if(
        a.hero.name==='Captain America'
    ){

        ctx.fillStyle='#fff';

        ctx.fillRect(
            -32,
            -54,
            10,
            26
        );

        ctx.fillStyle='#e63946';

        ctx.fillRect(
            -33,
            -58,
            12,
            4
        );
    }


    /* THOR */

    if(
        a.hero.name==='Thor'
    ){

        ctx.fillStyle='#cdd9ff';

        ctx.fillRect(
            25,
            -63,
            8,
            25
        );

        ctx.fillStyle='#a6b4d8';

        ctx.fillRect(
            26,
            -70,
            15,
            7
        );
    }


    /* HULK */

    if(
        a.hero.name==='Hulk'
    ){

        ctx.fillStyle='#57c84d';

        ctx.fillRect(
            -16,
            -88,
            32,
            22
        );

        ctx.fillStyle='#18381c';

        ctx.fillRect(
            -24,
            -64,
            48,
            8
        );
    }


    /* WOLVERINE */

    if(
        a.hero.name==='Wolverine'
    ){

        ctx.fillStyle='#e7d56e';

        ctx.fillRect(
            -17,
            -95,
            34,
            10
        );
    }


    /* SPIDER-MAN MASK */

    if(
        a.hero.name==='Spider-Man'
    ){

        ctx.fillStyle='#ffeaec';

        ctx.fillRect(
            -10,
            -80,
            7,
            4
        );

        ctx.fillRect(
            3,
            -80,
            7,
            4
        );

        ctx.strokeStyle='#fff';

        ctx.lineWidth=1;

        for(
            let i=-12;
            i<=12;
            i+=6
        ){

            ctx.beginPath();

            ctx.moveTo(
                0,
                -78
            );

            ctx.lineTo(
                i,
                -61
            );

            ctx.stroke();
        }
    }


    /* SHIELD */

    if(a.shield>0){

        ctx.strokeStyle='#74c0ff';

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            0,
            -43,
            50,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    ctx.restore();
}


/*
==========================================
PROJECTILES
==========================================
*/

function renderProjectiles(){

    for(
        const p of projectiles
    ){

        ctx.fillStyle=
            p.color;

        ctx.fillRect(
            Math.round(
                p.x-p.r
            ),
            Math.round(
                p.y-p.r
            ),
            p.r*2,
            p.r*2
        );

        ctx.fillStyle='#fff';

        ctx.fillRect(
            Math.round(
                p.x-2
            ),
            Math.round(
                p.y-2
            ),
            4,
            4
        );
    }
}


/*
==========================================
EFFECTS RENDER
==========================================
*/

function renderEffects(){

    for(
        const e of effects
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                e.life/.7
            );


        /* BEAM */

        if(e.type==='beam'){

            const a=e.owner;

            ctx.fillStyle=
                a.hero.color;

            ctx.fillRect(

                a.x,

                a.y-a.h*.6,

                a.dir*380,

                12
            );

            ctx.fillStyle='#fff';

            ctx.fillRect(

                a.x,

                a.y-a.h*.6,

                a.dir*320,

                4
            );
        }


        /* LIGHTNING */

        else if(

            [
                'lightning',
                'storm',
                'ragnarok'
            ].includes(e.type)

        ){

            ctx.fillStyle=
                e.owner.hero.color;

            for(
                let i=0;
                i<8;
                i++
            ){

                const x=
                    e.owner.x+
                    rnd(-220,220);

                ctx.fillRect(

                    x,

                    G-310-rnd(0,90),

                    rnd(3,9),

                    rnd(80,180)
                );
            }
        }


        /* AURA */

        else if(e.owner){

            ctx.fillStyle=
                e.owner.hero.color;

            ctx.beginPath();

            ctx.arc(

                e.owner.x,

                e.owner.y-45,

                80*
                (1-e.life/.7)
                +20,

                0,
                Math.PI*2
            );

            ctx.fill();
        }


        /* KO */

        if(e.type==='ko'){

            ctx.fillStyle='#ffe36e';

            ctx.font=
                '900 38px monospace';

            ctx.fillText(
                'KO!',
                e.x-38,
                e.y-120
            );
        }

        ctx.globalAlpha=1;
    }
}


/*
==========================================
PARTICLES
==========================================
*/

function renderParticles(){

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                p.life/.6
            );

        ctx.fillStyle=
            p.color;

        ctx.fillRect(

            Math.round(p.x),

            Math.round(p.y),

            p.s,

            p.s
        );
    }

    ctx.globalAlpha=1;

    for(
        const t of texts
    ){

        ctx.globalAlpha =
            Math.max(
                0,
                t.life/.8
            );

        ctx.fillStyle=
            t.color;

        ctx.font=
            '900 18px monospace';

        ctx.textAlign='center';

        ctx.fillText(

            t.text,

            Math.round(t.x),

            Math.round(t.y)
        );
    }

    ctx.globalAlpha=1;

    ctx.textAlign='left';
}


/*
==========================================
MAIN RENDER
==========================================
*/

function render(){

    let sx=0;
    let sy=0;

    if(shake>0){

        shake-=.016;

        sx=rnd(-6,6);

        sy=rnd(-4,4);
    }

    ctx.save();

    ctx.translate(
        sx,
        sy
    );

    bg();

    renderProjectiles();

    renderEffects();

    drawPixelHero(P);

    drawPixelHero(E);

    renderParticles();

    ctx.restore();

    requestAnimationFrame(render);
}


/*
==========================================
KEYBOARD
==========================================
*/

function keyName(k){

    return k.toLowerCase();
}

addEventListener(
    'keydown',
    e=>{

        const k =
            keyName(e.key);

        if(
            [
                'arrowleft',
                'arrowright',
                'a',
                'd',
                'j',
                'q',
                'w',
                'e',
                'r',
                ' '
            ].includes(k)
        ){

            e.preventDefault();
        }

        /* P = HIDE HUD */

        if(k==='p'){

            pausedHud=!pausedHud;

            document
                .getElementById('hud')
                .classList.toggle(
                    'hidden',
                    pausedHud ||
                    !running
                );

            return;
        }

        keys[k]=true;
    }
);

addEventListener(
    'keyup',
    e=>{

        keys[
            keyName(e.key)
        ]=false;
    }
);


/*
==========================================
ROSTER
==========================================
*/

document
.getElementById('roster')
.innerHTML =

heroKeys
.map(
    key=>{

        const hero =
            heroes[key];

        return `

        <div
            class="hero ${
                key===selected
                ? 'active'
                : ''
            }"
            data-hero="${key}"
        >

            <div class="sprite">
                ${hero.emoji}
            </div>

            <b>
                ${hero.name}
            </b>

            <small>
                Q ${hero.skills[0][1]}<br>
                W ${hero.skills[1][1]}<br>
                E ${hero.skills[2][1]}<br>
                R ${hero.skills[3][1]}
            </small>

        </div>

        `;
    }
)
.join('');


document
.querySelectorAll('.hero')
.forEach(
    el=>{

        el.onclick=()=>{

            selected =
                el.dataset.hero;

            document
            .querySelectorAll('.hero')
            .forEach(
                x=>
                    x.classList
                    .remove('active')
            );

            el.classList.add(
                'active'
            );
        };
    }
);


/*
==========================================
START / AGAIN
==========================================
*/

document
.getElementById('start')
.onclick =
    spawnGame;


document
.getElementById('again')
.onclick =
    ()=>{

        document
        .getElementById('result')
        .classList
        .add('hidden');

        document
        .getElementById('select')
        .classList
        .remove('hidden');

        running=false;

        document
        .getElementById('hud')
        .classList
        .add('hidden');
    };


/*
==========================================
MOBILE BUTTONS
==========================================
*/

document
.querySelectorAll('[data-key]')
.forEach(
    btn=>{

        const k =
            btn.dataset.key;

        const down =
            e=>{

                e.preventDefault();

                keys[k]=true;

                if(k==='space')
                    keys.wup=true;
            };

        const up =
            e=>{

                e.preventDefault();

                keys[k]=false;

                if(k==='space')
                    keys.wup=false;
            };

        btn.addEventListener(
            'pointerdown',
            down
        );

        btn.addEventListener(
            'pointerup',
            up
        );

        btn.addEventListener(
            'pointercancel',
            up
        );

        btn.addEventListener(
            'pointerleave',
            up
        );
    }
);


/*
==========================================
GAME LOOP
==========================================
*/

function gameLoop(now){

    const dt =
        Math.min(
            (now-last)/1000,
            .033
        );

    last=now;

    tick(dt);

    requestAnimationFrame(
        gameLoop
    );
}

render();

requestAnimationFrame(
    gameLoop
);

</script>

</body>
</html>
